name: Update Cesturefy description

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-cesturefy-description.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update Cesturefy description
        shell: python
        run: |
          from pathlib import Path

          path = Path('Markdown Notes/ChromeOS & Android Optimization Guide.md')
          old = '* **[Cesturefy](https://chromewebstore.google.com/detail/cesturefy-navigate-operat/bifgfhokfobhebifcogneljkpaaloonp)**：マウスジェスチャーで快適ブラウジング'
          new = '* **[Cesturefy](https://chromewebstore.google.com/detail/cesturefy-navigate-operat/bifgfhokfobhebifcogneljkpaaloonp)**：マウス、ロッカー、ホイールジェスチャーでブラウザ操作を効率化する拡張機能。'
          text = path.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('Target Cesturefy line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Markdown Notes/ChromeOS & Android Optimization Guide.md"
          git diff --cached --check
          git commit -m "Improve Cesturefy description"
          git push origin HEAD:main
