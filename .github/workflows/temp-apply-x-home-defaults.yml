name: Temporary X Home Defaults Update

on:
  push:
    branches:
      - fix/x-hide-for-you-tab

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/x-hide-for-you-tab

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply requested changes
        run: |
          python scripts/apply_x_home_defaults.py
          python "uBOL Filter Converter/converter.py"
          node --check UserScript/x-auto-select-following-latest-sort.user.js
          python scripts/check_adguard_filter_integrity.py

      - name: Commit synchronized changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            "AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt" \
            "UserScript/x-auto-select-following-latest-sort.user.js" \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt" \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json"
          git commit -m 'Apply X home defaults'
          git push origin HEAD:fix/x-hide-for-you-tab
