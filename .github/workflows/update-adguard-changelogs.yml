name: Update AdGuard Changelogs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_adguard_changelogs.py'
      - 'tests/test_update_adguard_changelogs.py'
      - 'config/adguard-converter-capabilities.json'
      - '.github/workflows/update-adguard-changelogs.yml'
  schedule:
    - cron: '7 19 * * *' # Daily at 04:07 JST.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch official AdGuard changelogs
        run: python scripts/update_adguard_changelogs.py
      - name: Run updater and converter tests
        run: python -m unittest discover -s tests -v
      - name: Commit mirrors and compatibility review if changed
        run: |
          paths=(
            'AdGuard Custom Rules/ChangeLog/adguard-browser-extension-CHANGELOG.source.md'
            'AdGuard Custom Rules/ChangeLog/adguard-for-android-CHANGELOG.source.md'
            'upstream/adguard/metadata.json'
            'upstream/adguard/converter-review.md'
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'No upstream AdGuard changelog changes detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          if git diff --cached --quiet -- "${paths[@]}"; then
            echo 'No content changes remain after Git normalization.'
            exit 0
          fi
          git commit -m 'Auto-update: AdGuard changelogs'
          git pull --rebase origin main
          git push
