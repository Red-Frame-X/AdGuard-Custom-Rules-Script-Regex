name: Update AdGuard Changelogs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_adguard_changelogs.py'
      - 'tests/test_update_adguard_changelogs.py'
      - 'requirements-ci.txt'
      - '.github/workflows/update-adguard-changelogs.yml'
  schedule:
    - cron: '7 19 * * *' # 毎日04:07 JSTに実行
  workflow_dispatch:

concurrency:
  # 同一ワークフローの重複実行だけを直列化する。異なる書き込みワークフローを
  # 同じgroupにすると、GitHub Actionsが古いpending runをキャンセルするため共有しない。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch, validate, and publish changelogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(
            'AdGuard Custom Rules/ChangeLog/adguard-browser-extension-CHANGELOG.source.md'
            'AdGuard Custom Rules/ChangeLog/adguard-for-android-CHANGELOG.source.md'
            'upstream/adguard/metadata.json'
            'upstream/adguard/converter-review.md'
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            # push競合時は最新mainから取得・テスト・生成をすべてやり直す。
            git fetch --no-tags origin main
            git reset --hard origin/main

            python -m pip install --disable-pip-version-check -r requirements-ci.txt
            python scripts/update_adguard_changelogs.py
            python -m unittest discover -s tests -v

            if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
              echo 'No upstream AdGuard changelog changes detected.'
              exit 0
            fi

            git add -- "${paths[@]}"
            if git diff --cached --quiet -- "${paths[@]}"; then
              echo 'No content changes remain after Git normalization.'
              exit 0
            fi

            git commit -m 'Auto-update: AdGuard changelogs'
            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo 'Failed to publish after 5 regenerate-and-push attempts.' >&2
              exit 1
            fi
            echo "main advanced during publication; regenerating from latest main ($attempt/5)."
            sleep $((attempt * 2))
          done
