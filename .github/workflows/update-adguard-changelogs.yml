name: Update AdGuard Changelogs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_adguard_changelogs.py'
      - 'tests/test_update_adguard_changelogs.py'
      - 'requirements-ci.txt'
      - '.github/workflows/update-adguard-changelogs.yml'
  schedule:
    - cron: '7 19 * * *' # 毎日04:07 JSTに実行
  workflow_dispatch:

concurrency:
  # すべてのmain書き込みワークフローを同じキューで直列化し、
  # 自動更新コミット同士のpush競合を防ぐ。
  group: repository-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # キュー待機中にmainが更新されても、最新状態を基点に取得・生成する。
      - name: Synchronize with latest main
        run: |
          git fetch --no-tags origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # このジョブは更新スクリプト外のテストも含むリポジトリ全体のPythonテストを実行するため、
      # 共通の固定済み依存関係マニフェストを使用する。
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Fetch official AdGuard changelogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_adguard_changelogs.py
      - name: Run updater and converter tests
        run: python -m unittest discover -s tests -v
      - name: Commit mirrors and compatibility review if changed
        run: |
          set -euo pipefail
          paths=(
            'AdGuard Custom Rules/ChangeLog/adguard-browser-extension-CHANGELOG.source.md'
            'AdGuard Custom Rules/ChangeLog/adguard-for-android-CHANGELOG.source.md'
            'upstream/adguard/metadata.json'
            'upstream/adguard/converter-review.md'
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'No upstream AdGuard changelog changes detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          if git diff --cached --quiet -- "${paths[@]}"; then
            echo 'No content changes remain after Git normalization.'
            exit 0
          fi
          git commit -m 'Auto-update: AdGuard changelogs'
          if ! git push origin HEAD:main; then
            echo 'main advanced outside the shared writer queue; rerun the workflow to regenerate from the latest main.' >&2
            exit 1
          fi
