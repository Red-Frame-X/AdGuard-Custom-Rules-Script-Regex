name: Reorder search browsing items

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reorder-search-browsing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Reorder items
        shell: python
        run: |
          from pathlib import Path
          path = Path('Markdown Notes/ChromeOS & Android Optimization Guide.md')
          text = path.read_text(encoding='utf-8')
          heading = '### 検索・ブラウジング補助\n'
          next_heading = '\n### 特定サイト向け拡張'
          start = text.index(heading) + len(heading)
          end = text.index(next_heading, start)
          lines = [line for line in text[start:end].splitlines() if line]
          order = ['Buster:', 'Cesturefy]', 'google-search-title-qualified', 'Search Result Previews', 'Tabs to Front v2', 'VertiTab', 'ブックマークサイドバー']
          if len(lines) != len(order) or any(not any(key in line for line in lines) for key in order):
              raise SystemExit('Unexpected search/browsing section contents')
          sorted_lines = []
          for key in order:
              matches = [line for line in lines if key in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one match for {key}')
              sorted_lines.append(matches[0])
          new_section = '\n'.join(sorted_lines) + '\n'
          path.write_text(text[:start] + new_section + text[end:], encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Markdown Notes/ChromeOS & Android Optimization Guide.md"
          git diff --cached --check
          git commit -m "Reorder search and browsing extensions"
          git push origin HEAD:main
