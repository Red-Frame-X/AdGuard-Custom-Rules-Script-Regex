name: Repository Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 実行中のチェックは維持する。保留中の実行は1件だけ保持されるため、
  # 同じグループに新しい実行が入ると古い保留中の実行が置き換わる場合がある。
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Validate canonical AdGuard filter integrity
        run: python scripts/check_adguard_filter_integrity.py

      - name: Validate workflow safety
        run: python scripts/check_workflow_safety.py

      # ワークフロー構文が壊れていると、ジョブ開始前に「No jobs were run」とだけ表示されることがある。
      # 通常CIで全ワークフローを検証し、YAML・式・イベント・埋め込みShellの問題を明示的に検出する。
      - name: Validate GitHub Actions workflow syntax
        run: bash scripts/check_workflow_syntax.sh

      - name: Preflight AdGuard user-rule edits
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            python scripts/check_adguard_user_rule_edit.py --base-ref "origin/${{ github.base_ref }}"
          else
            python scripts/check_adguard_user_rule_edit.py
          fi

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s "uBOL Filter Converter/tests" -v

      # 変換処理が完走し、生成物に不要な空白差分がないことを常に確認する。
      # mainへのpush後はbuild-ubol.ymlが生成物を同期するため、PRでは生成物の遅延だけを理由に失敗させない。
      - name: Validate uBOL output generation
        run: |
          python "uBOL Filter Converter/converter.py"
          git diff --check -- \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt" \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json"

      - name: Report unsynchronized uBOL outputs on pull requests
        if: github.event_name == 'pull_request'
        run: |
          output='uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt'
          report='uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json'
          if git diff --quiet -- "$output" "$report"; then
            echo 'Generated uBOL outputs are synchronized.'
          else
            echo '::notice title=uBOL generated outputs pending synchronization::Generated uBOL outputs differ from the committed files. build-ubol.yml will synchronize them automatically after the PR is merged to main.'
            git diff -- "$output" "$report"
          fi

      - name: Run Markdownlint
        run: npm run lint:markdown

      - name: Check UserScript syntax
        run: |
          shopt -s nullglob
          files=(UserScript/*.js)
          if (( ${#files[@]} == 0 )); then
            echo 'No UserScript files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run AGLint
        run: npm run lint:adguard
