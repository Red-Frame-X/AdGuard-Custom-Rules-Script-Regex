name: Repository Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s "uBOL Filter Converter/tests" -v

      # Validate that the converter can regenerate both outputs on every change.
      # Pull requests must commit deterministic generated outputs; build-ubol.yml also repairs direct main pushes.
      - name: Validate uBOL output generation
        run: |
          python "uBOL Filter Converter/converter.py"
          git diff --check -- \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt" \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json"
          git diff --exit-code -- \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt" \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json"

      - name: Run Markdownlint
        run: npm run lint:markdown

      - name: Check UserScript syntax
        run: |
          for file in UserScript/*.js; do
            node --check "$file"
          done

      - name: Run AGLint
        run: npm run lint:adguard
