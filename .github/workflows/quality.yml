name: Repository Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Quality checks are status-bearing validation runs. Do not cancel an older
  # run merely because another commit is pushed shortly afterwards: cancelled
  # runs can make the Actions history and README badge look like a CI failure.
  # GitHub will serialize runs in the same group instead.
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s "uBOL Filter Converter/tests" -v

      # Validate converter determinism everywhere, but require committed generated
      # outputs to be fully synchronized only on pull requests. Direct pushes to
      # main are repaired by build-ubol.yml, so failing here would create a race
      # between the quality and auto-generation workflows.
      - name: Validate uBOL output generation
        run: |
          python "uBOL Filter Converter/converter.py"
          git diff --check -- \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt" \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json"

      - name: Require synchronized uBOL outputs on pull requests
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt" \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json"

      - name: Run Markdownlint
        run: npm run lint:markdown

      - name: Check UserScript syntax
        run: |
          shopt -s nullglob
          files=(UserScript/*.js)
          if (( ${#files[@]} == 0 )); then
            echo 'No UserScript files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run AGLint
        run: npm run lint:adguard
