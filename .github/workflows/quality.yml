name: Repository Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s "uBOL Filter Converter/tests" -v

      # Direct pushes are followed by build-ubol.yml, which publishes generated files.
      # Pull requests must include matching generated outputs before merge.
      - name: Verify committed uBOL outputs
        if: github.event_name == 'pull_request'
        run: |
          python "uBOL Filter Converter/converter.py"
          git diff --exit-code -- \
            "uBOL Filter Converter/dist/AdGuard_Custom_Rules_uBOL.txt" \
            "uBOL Filter Converter/dist/AdGuard_Custom_Rules_uBOL.report.json"

      - name: Run Markdownlint
        run: npm run lint:markdown

      - name: Check UserScript syntax
        run: |
          for file in UserScript/*.js; do
            node --check "$file"
          done

      - name: Run AGLint
        run: npm run lint:adguard
