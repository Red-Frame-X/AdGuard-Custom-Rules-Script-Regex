name: Repository Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Quality checks are status-bearing validation runs. Do not cancel an older
  # run merely because another commit is pushed shortly afterwards: cancelled
  # runs can make the Actions history and README badge look like a CI failure.
  # GitHub will serialize runs in the same group instead.
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Validate canonical AdGuard filter integrity
        run: python scripts/check_adguard_filter_integrity.py

      - name: Preflight AdGuard user-rule edits
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            python scripts/check_adguard_user_rule_edit.py --base-ref "origin/${{ github.base_ref }}"
          else
            python scripts/check_adguard_user_rule_edit.py
          fi

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s "uBOL Filter Converter/tests" -v

      # Always validate that the converter runs successfully and produces
      # whitespace-clean output. Generated files are synchronized automatically
      # on pushes to main by build-ubol.yml, so PR validation must not fail only
      # because committed dist files are one generation behind the source filter.
      - name: Validate uBOL output generation
        run: |
          python "uBOL Filter Converter/converter.py"
          git diff --check -- \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt" \
            "uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json"

      - name: Report unsynchronized uBOL outputs on pull requests
        if: github.event_name == 'pull_request'
        run: |
          output='uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt'
          report='uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json'
          if git diff --quiet -- "$output" "$report"; then
            echo 'Generated uBOL outputs are synchronized.'
          else
            echo '::notice title=uBOL generated outputs pending synchronization::Generated uBOL outputs differ from the committed files. build-ubol.yml will synchronize them automatically after the PR is merged to main.'
            git diff -- "$output" "$report"
          fi

      - name: Run Markdownlint
        run: npm run lint:markdown

      - name: Check UserScript syntax
        run: |
          shopt -s nullglob
          files=(UserScript/*.js)
          if (( ${#files[@]} == 0 )); then
            echo 'No UserScript files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run AGLint
        run: npm run lint:adguard
