name: Restore ChromeOS Chrome theme backup

on:
  push:
    paths:
      - '.github/workflows/restore-chrome-theme.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Royal Desert Sand Dark Tabs section
        shell: python
        run: |
          from pathlib import Path
          path = Path('Markdown Notes/ChromeOS & Android Optimization Guide.md')
          text = path.read_text(encoding='utf-8')
          old = '''## ChromeOS Chrome テーマ
          * **[Chrome Web Store テーマ](https://chromewebstore.google.com/category/themes)**
          * **[Dark Horizon](https://chromewebstore.google.com/detail/dark-horizon/ncjjeokpcnllmmbbipeaagmdpdpiadin)**：Chrome標準テーマに近い外観を、より暗い配色にしたシンプルなダークテーマ。
          * **[Royal Desert Sand](https://chromewebstore.google.com/detail/royal-desert-sand/nnieplejkjaodhemceganohmdkfekkem)**：デザートサンド（砂漠の砂）系の落ち着いた暖色とロイヤルブルーを組み合わせた、シンプルで上品なChromeテーマ。
          '''
          new = '''## ChromeOS Chrome テーマ
          * **[Chrome Web Store テーマ](https://chromewebstore.google.com/category/themes)**
          * **[Dark Horizon](https://chromewebstore.google.com/detail/dark-horizon/ncjjeokpcnllmmbbipeaagmdpdpiadin)**：Chrome標準テーマに近い外観を、より暗い配色にしたシンプルなダークテーマ。
          * **[Royal Desert Sand](https://chromewebstore.google.com/detail/royal-desert-sand/nnieplejkjaodhemceganohmdkfekkem)**：デザートサンド（砂漠の砂）系の落ち着いた暖色とロイヤルブルーを組み合わせた、シンプルで上品なChromeテーマ。
          * **[Royal Desert Sand Dark Tabs](../royal_desert_sand_dark_tabs.zip)**：Royal Desert Sand系の配色をベースに、バックグラウンドタブを濃いブルー系に調整し、アクティブタブと非アクティブタブを見分けやすくしたカスタムChromeテーマ。新しいタブページの背景はグレー系。

          ZIPを展開し、Chromeの「拡張機能」ページでデベロッパーモードを有効にして、展開したテーマフォルダを「パッケージ化されていない拡張機能を読み込む」から指定して利用します。
          '''
          if old not in text:
              raise SystemExit('Expected ChromeOS Chrome theme section was not found; refusing broad rewrite.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-off workflow and commit restoration
        run: |
          git rm .github/workflows/restore-chrome-theme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Markdown Notes/ChromeOS & Android Optimization Guide.md'
          git commit -m 'docs: restore Royal Desert Sand Dark Tabs theme backup'
          git push
