name: Update uBO Lite Changelog Metadata

on:
  push:
    branches:
      - main
    paths:
      - 'uBOL Filter Converter/update_ubol_metadata.py'
      - 'uBOL Filter Converter/tests/test_update_ubol_metadata.py'
      - '.github/workflows/update-ubol-changelog.yml'
  schedule:
    # Daily at 03:37 JST. Avoid minute 0 to reduce scheduled-run congestion.
    - cron: '37 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Fetch uBO Lite changelog metadata
        run: python "uBOL Filter Converter/update_ubol_metadata.py"

      - name: Run converter tests
        run: python -m unittest discover -s "uBOL Filter Converter/tests" -v

      - name: Commit metadata if changed
        run: |
          metadata='uBOL Filter Converter/upstream/ubol-changelog.json'
          if git diff --quiet -- "$metadata"; then
            echo 'No upstream changelog changes detected.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$metadata"
          git commit -m 'Auto-update: uBO Lite changelog metadata'
          git push
