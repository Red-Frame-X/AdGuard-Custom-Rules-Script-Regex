name: Update uBO Lite Japanese Changelog

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/translate_changelog.py'
      - 'requirements-translation.txt'
      - 'uBOL Filter Converter/update_ubol_metadata.py'
      - 'uBOL Filter Converter/tests/test_update_ubol_metadata.py'
      - '.github/workflows/update-ubol-changelog.yml'
  schedule:
    - cron: '37 18 * * *' # Daily at 03:37 JST.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-translation.txt

      - name: Install offline translation engine
        run: python -m pip install --disable-pip-version-check -r requirements-translation.txt

      - name: Fetch uBO Lite changelog metadata
        run: python "uBOL Filter Converter/update_ubol_metadata.py"

      - name: Translate changelog into Japanese
        run: |
          python scripts/translate_changelog.py \
            --source "uBOL Filter Converter/upstream/ubol-CHANGELOG.source.md" \
            --output "uBOL Filter Converter/upstream/ubol-CHANGELOG.md" \
            --cache "uBOL Filter Converter/upstream/ubol-translation-cache.json"

      - name: Run converter tests
        run: python -m unittest discover -s "uBOL Filter Converter/tests" -v

      - name: Commit Japanese changelog if changed
        run: |
          paths=(
            'uBOL Filter Converter/upstream/ubol-changelog.json'
            'uBOL Filter Converter/upstream/ubol-CHANGELOG.source.md'
            'uBOL Filter Converter/upstream/ubol-CHANGELOG.md'
            'uBOL Filter Converter/upstream/ubol-translation-cache.json'
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'No upstream changelog changes detected.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'Auto-update: uBO Lite Japanese changelog'
          git pull --rebase origin main
          git push
