name: Update uBO Lite Changelog

on:
  push:
    branches:
      - main
    paths:
      - 'uBOL Filter Converter/update_ubol_metadata.py'
      - 'uBOL Filter Converter/tests/test_update_ubol_metadata.py'
      - '.github/workflows/update-ubol-changelog.yml'
  schedule:
    - cron: '37 18 * * *' # 毎日03:37 JSTに実行
  workflow_dispatch:

concurrency:
  # 同一ワークフローの重複実行だけを直列化する。異なる書き込みワークフローを
  # 同じgroupにすると、GitHub Actionsが古いpending runをキャンセルするため共有しない。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch, validate, and publish changelog metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(
            'uBOL Filter Converter/upstream/ubol-changelog.json'
            'uBOL Filter Converter/upstream/ubol-CHANGELOG.source.md'
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            # push競合時は最新mainから取得・テスト・生成をすべてやり直す。
            git fetch --no-tags origin main
            git reset --hard origin/main

            python "uBOL Filter Converter/update_ubol_metadata.py"
            python -m unittest discover -s "uBOL Filter Converter/tests" -v

            if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
              echo 'No upstream changelog changes detected.'
              exit 0
            fi

            git add -- "${paths[@]}"
            if git diff --cached --quiet -- "${paths[@]}"; then
              echo 'No content changes remain after Git normalization.'
              exit 0
            fi

            git commit -m 'Auto-update: uBO Lite changelog'
            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo 'Failed to publish after 5 regenerate-and-push attempts.' >&2
              exit 1
            fi
            echo "main advanced during publication; regenerating from latest main ($attempt/5)."
            sleep $((attempt * 2))
          done
