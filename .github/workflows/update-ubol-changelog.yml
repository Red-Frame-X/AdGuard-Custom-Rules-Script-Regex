name: Update uBO Lite Changelog

on:
  push:
    branches:
      - main
    paths:
      - 'uBOL Filter Converter/update_ubol_metadata.py'
      - 'uBOL Filter Converter/tests/test_update_ubol_metadata.py'
      - '.github/workflows/update-ubol-changelog.yml'
  schedule:
    - cron: '37 18 * * *' # 毎日03:37 JSTに実行
  workflow_dispatch:

concurrency:
  # すべてのmain書き込みワークフローを同じキューで直列化し、
  # 自動更新コミット同士のpush競合を防ぐ。
  group: repository-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # キュー待機中にmainが更新されても、最新状態を基点に取得・生成する。
      - name: Synchronize with latest main
        run: |
          git fetch --no-tags origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch uBO Lite changelog metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python "uBOL Filter Converter/update_ubol_metadata.py"

      - name: Run converter tests
        run: python -m unittest discover -s "uBOL Filter Converter/tests" -v

      - name: Commit changelog metadata if changed
        run: |
          set -euo pipefail
          paths=(
            'uBOL Filter Converter/upstream/ubol-changelog.json'
            'uBOL Filter Converter/upstream/ubol-CHANGELOG.source.md'
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'No upstream changelog changes detected.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          if git diff --cached --quiet -- "${paths[@]}"; then
            echo 'No content changes remain after Git normalization.'
            exit 0
          fi
          git commit -m 'Auto-update: uBO Lite changelog'
          if ! git push origin HEAD:main; then
            echo 'main advanced outside the shared writer queue; rerun the workflow to regenerate from the latest main.' >&2
            exit 1
          fi
