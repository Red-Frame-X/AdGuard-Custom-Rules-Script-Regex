name: Build uBOL Filter - Red Frame X

on:
  push:
    branches:
      - main
    paths:
      - 'AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt'
      - 'uBOL Filter Converter/converter.py'
      - 'uBOL Filter Converter/converter_impl.py'
      - 'uBOL Filter Converter/tests/**'
      - '.github/workflows/build-ubol.yml'
  workflow_dispatch:

concurrency:
  # 同一ワークフローの重複実行だけを直列化する。異なる書き込みワークフローを
  # 同じgroupにすると、GitHub Actionsが古いpending runをキャンセルするため共有しない。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build, validate, and publish
        run: |
          set -euo pipefail
          output='uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt'
          report='uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            # push競合が起きた場合は完成済みコミットをrebaseせず、最新mainから再生成する。
            git fetch --no-tags origin main
            git reset --hard origin/main

            python -m unittest discover -s "uBOL Filter Converter/tests" -v
            python "uBOL Filter Converter/converter.py"

            if git diff --quiet -- "$output" "$report"; then
              echo 'No generated changes detected.'
              exit 0
            fi

            git add -- "$output" "$report"
            git commit -m 'Auto-update: uBOL Filter - Red Frame X'
            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo 'Failed to publish after 5 regenerate-and-push attempts.' >&2
              exit 1
            fi
            echo "main advanced during publication; regenerating from latest main ($attempt/5)."
            sleep $((attempt * 2))
          done
