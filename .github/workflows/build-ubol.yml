name: Build uBO Lite Filter

on:
  push:
    branches:
      - main
    paths:
      - 'AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt'
      - 'uBOL Filter Converter/converter.py'
      - 'uBOL Filter Converter/converter_impl.py'
      - 'uBOL Filter Converter/tests/test_converter.py'
      - '.github/workflows/build-ubol.yml'
  workflow_dispatch:

concurrency:
  # Serialize every workflow that can push to main to avoid non-fast-forward races.
  group: repository-content-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run converter tests
        run: python -m unittest discover -s "uBOL Filter Converter/tests" -v

      - name: Build filter and report
        run: python "uBOL Filter Converter/converter.py"

      - name: Commit generated outputs if changed
        run: |
          set -euo pipefail
          output='uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt'
          report='uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json'
          if git diff --quiet -- "$output" "$report"; then
            echo 'No generated changes detected.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$output" "$report"
          git commit -m 'Auto-update: uBOL Filter - Red Frame X'
          git pull --rebase origin main
          git push
