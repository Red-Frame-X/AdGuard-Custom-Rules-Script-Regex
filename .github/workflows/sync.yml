name: Sync and Convert uB-filter-by-kdroidwin

on:
  schedule:
    # サーバー負荷分散のため0分を避けて15分に設定 (JST 12:15, 18:15, 0:15, 6:15)
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      # scripts/ フォルダ内の convert.py を実行
      - name: Run Conversion Script
        run: python scripts/convert.py

      # 公開前に生成物と管理対象のAdGuardルールを構文検証
      - name: Run AGLint
        run: >-
          npx --yes @adguard/aglint@3.0.2
          dist/uB-filter-by-kdroidwin_AdG_Optimized.txt
          "AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt"
          "AdGuard Custom Rules/AdGuard DNS Custom Rules - Red Frame X.txt"

      - name: Commit and Push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # distディレクトリ全体をステージング
          git add dist/
          
          # ステージングされた変更がある場合のみコミット＆プッシュを実行
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: uB-filter-by-kdroidwin (AdGuard Optimized)"
            git push
            echo "Changes committed and pushed successfully."
          else
            echo "No changes detected in filter rules. Skipping commit."
          fi
