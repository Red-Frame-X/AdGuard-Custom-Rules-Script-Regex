name: Sync and Convert uB-filter-by-kdroidwin (AdGuard Optimized)

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/convert.py'
      - 'tests/test_convert.py'
      - 'config/adguard-converter-capabilities.json'
      - '.github/workflows/sync.yml'
  schedule:
    # サーバー負荷分散のため0分を避けて15分に設定 (JST 12:15, 18:15, 0:15, 6:15)
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  # Keep each writer's queue independent. Cross-workflow push races are handled
  # by the bounded pull/rebase/push retry loop below.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Create dist directory
        run: mkdir -p dist

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      # 依存関係のインストール前に変換し、生成物の差分を判定
      - name: Run Conversion Script
        id: conversion
        run: |
          python scripts/convert.py

          if git diff --quiet -- 'dist/uB-filter-by-kdroidwin (AdGuard Optimized).txt'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated filter changed."
          fi

      # 生成物に差分がある場合だけ、公開前検証に必要な依存関係を導入
      - name: Install Node.js dependencies
        if: steps.conversion.outputs.changed == 'true'
        run: npm ci

      # 他の管理対象ルールは quality.yml で検証するため、ここでは生成物だけを検証
      - name: Run AGLint
        if: steps.conversion.outputs.changed == 'true'
        run: npx --no-install aglint 'dist/uB-filter-by-kdroidwin (AdGuard Optimized).txt'

      - name: Commit and Push if changed
        if: steps.conversion.outputs.changed == 'true'
        run: |
          set -euo pipefail
          output='dist/uB-filter-by-kdroidwin (AdGuard Optimized).txt'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the generated artifact owned by this workflow.
          git add -- "$output"

          if ! git diff --staged --quiet -- "$output"; then
            git commit -m "Auto-update: uB-filter-by-kdroidwin (AdGuard Optimized)"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo 'Failed to push after 5 attempts.' >&2
                exit 1
              fi
              echo "Push raced with another workflow; retrying ($attempt/5)."
              sleep $((attempt * 2))
            done
            echo "Changes committed and pushed successfully."
          else
            echo "No changes detected in filter rules. Skipping commit."
          fi
