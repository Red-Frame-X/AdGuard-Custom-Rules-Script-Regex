name: Sync and Convert uB-filter-by-kdroidwin

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/convert.py'
      - 'tests/test_convert.py'
      - '.github/workflows/sync.yml'
  schedule:
    # サーバー負荷分散のため0分を避けて15分に設定 (JST 12:15, 18:15, 0:15, 6:15)
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      # 依存関係のインストール前に変換し、生成物の差分を判定
      - name: Run Conversion Script
        id: conversion
        run: |
          python scripts/convert.py

          if git diff --quiet -- dist/uB-filter-by-kdroidwin_AdG_Optimized.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated filter changed."
          fi

      # 生成物に差分がある場合だけ、公開前検証に必要な依存関係を導入
      - name: Install Node.js dependencies
        if: steps.conversion.outputs.changed == 'true'
        run: npm ci

      # 他の管理対象ルールは quality.yml で検証するため、ここでは生成物だけを検証
      - name: Run AGLint
        if: steps.conversion.outputs.changed == 'true'
        run: npx --no-install aglint dist/uB-filter-by-kdroidwin_AdG_Optimized.txt

      - name: Commit and Push if changed
        if: steps.conversion.outputs.changed == 'true'
        run: |
          set -euo pipefail
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # distディレクトリ全体をステージング
          git add dist/
          
          # ステージングされた変更がある場合のみコミット＆プッシュを実行
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: uB-filter-by-kdroidwin (AdGuard Optimized)"
            git push
            echo "Changes committed and pushed successfully."
          else
            echo "No changes detected in filter rules. Skipping commit."
          fi
