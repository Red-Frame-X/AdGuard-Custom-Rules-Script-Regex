name: Sync and Convert uB-filter-by-kdroidwin (AdGuard Optimized)

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/convert.py'
      - 'tests/test_convert.py'
      - 'config/adguard-converter-capabilities.json'
      - '.github/workflows/sync.yml'
      - 'requirements-ci.txt'
  schedule:
    # サーバー負荷分散のため0分を避けて15分に設定 (JST 12:15, 18:15, 0:15, 6:15)
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  # 同一ワークフローの重複実行だけを直列化する。異なる書き込みワークフローを
  # 同じgroupにすると、GitHub Actionsが古いpending runをキャンセルするため共有しない。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Convert, validate, and publish
        run: |
          set -euo pipefail
          output='dist/uB-filter-by-kdroidwin (AdGuard Optimized).txt'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # push競合時は最新mainへ戻し、依存関係・テスト・生成・検証をやり直す。
            git fetch --no-tags origin main
            git reset --hard origin/main

            python -m pip install --disable-pip-version-check -r requirements-ci.txt
            mkdir -p dist
            python -m unittest discover -s tests -v
            python scripts/convert.py

            if git diff --quiet -- "$output"; then
              echo 'No generated changes detected.'
              exit 0
            fi

            npm ci
            npx --no-install aglint "$output"
            git add -- "$output"
            if git diff --cached --quiet -- "$output"; then
              echo 'No changes remain after Git normalization.'
              exit 0
            fi

            git commit -m "Auto-update: uB-filter-by-kdroidwin (AdGuard Optimized)"
            if git push origin HEAD:main; then
              echo 'Changes committed and pushed successfully.'
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo 'Failed to publish after 5 regenerate-and-push attempts.' >&2
              exit 1
            fi
            echo "main advanced during publication; regenerating from latest main ($attempt/5)."
            sleep $((attempt * 2))
          done
