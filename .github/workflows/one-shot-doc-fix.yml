name: One-shot documentation fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-doc-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rewrite AdGuard recovery explanation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Markdown Notes/ChromeOS & Android Optimization Guide.md')
          text = path.read_text(encoding='utf-8')

          old = (
              "  ③と④を同じ「VPN状態の変化時 > 無効」トリガーにしておくと、AdGuardのVPN接続が無効になったタイミングで、③の `start` によりまずAdGuard for Androidの保護開始を要求し、続けて④の `update` でフィルタとアプリの更新確認を実行できます。さらに、更新処理に伴ってAdGuard側で保護サービスが再初期化・再起動される場合があるため、結果として短時間に2段階の再初期化が入る構成になります。これにより、一度の再起動だけでは復帰しにくいケースでVPN接続が復旧する可能性を高めることを狙った運用です。\n"
              "\n"
              "  ただし、これはAdGuard公式が「2回再起動すれば復帰率が向上する」と保証している手順ではなく、MacroDroidによる実運用上の回避策です。端末やAndroidの電源管理、VPN状態、AdGuardの内部状態によって挙動は変わるため、必要に応じて③と④の間に短い待機時間を入れ、端末ごとに動作確認してください。\n"
          )

          new = (
              "  ③と④を同じ「VPN状態の変化時 > 無効」トリガーにすると、AdGuardのVPN接続が無効になった際に、③の `start` でAdGuardの保護を再開し、その後④の `update` で利用可能なフィルタとAdGuardアプリ本体の更新を確認できます。AdGuard公式ドキュメントでは、`start` は「保護を開始する」、`update` は「利用可能なフィルタとアプリの更新を確認する」アクションとしてそれぞれ定義されています。（[AdGuard公式：Android版の自動化](https://adguard.com/kb/adguard-for-android/solving-problems/tasker/)）\n"
              "\n"
              "  この構成の目的は、VPNが無効になったときに「保護の再起動」と「更新確認」を続けて実行し、AdGuardを通常の保護状態へ戻しやすくすることです。ただし、公式ドキュメントには `update` が保護を再起動するとは記載されていないため、④を「2回目の再起動」とみなすことはできません。確実に2回の再起動を行いたい場合は、④の `update` の後に別途 `start` を実行するアクションを追加する必要があります。端末やAndroidの電源管理によって復帰挙動は異なるため、必要に応じて各アクションの間に短い待機時間を入れて動作確認してください。\n"
          )

          if old not in text:
              raise SystemExit('Target text not found; refusing to modify the document.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm '.github/workflows/one-shot-doc-fix.yml'

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Markdown Notes/ChromeOS & Android Optimization Guide.md' '.github/workflows/one-shot-doc-fix.yml'
          git commit -m 'docs: clarify AdGuard restart and update behavior'
          git push
