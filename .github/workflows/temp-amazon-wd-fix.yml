name: Temporary Amazon wd-shoppable filter fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-amazon-wd-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Add outer Amazon ad-card rule and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'^! Version: \d{12}$',
              '! Version: 202608271833',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit('Could not update exactly one Version field')

          anchor = (
              '! Amazonトップページのdesktop-wd-1スポンサー広告枠を非表示\n'
              'amazon.co.jp###ape_Gateway_desktop-wd-1_desktop_wrapper\n'
          )
          addition = (
              '! Amazonトップページのdesktop-wd-1広告カード外枠を非表示\n'
              'amazon.co.jp###wd-shoppable-1\n'
          )
          if 'amazon.co.jp###wd-shoppable-1' not in text:
              if anchor not in text:
                  raise SystemExit('Amazon rule insertion anchor not found')
              text = text.replace(anchor, anchor + addition, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate uBOL outputs
        run: python "uBOL Filter Converter/converter.py"

      - name: Validate generated changes
        run: |
          git diff --check
          grep -F '! Version: 202608271833' 'AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt'
          grep -F 'amazon.co.jp###wd-shoppable-1' 'AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt'
          grep -F '! Version: 202608271833' 'uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt'
          grep -F 'amazon.co.jp###wd-shoppable-1' 'uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt'

      - name: Commit synchronized filter updates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt' \
            'uBOL Filter Converter/dist/uBOL Filter - Red Frame X.txt' \
            'uBOL Filter Converter/dist/uBOL Filter - Red Frame X.report.json'
          if git diff --cached --quiet; then
            echo 'No filter changes required.'
            exit 0
          fi
          git commit -m 'Fix Amazon desktop-wd-1 outer ad card'
          git pull --rebase origin main
          git push origin HEAD:main
